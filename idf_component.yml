version: "0.3.1"
description: >
  WiFi lifecycle manager for ESP-IDF. Handles scanning, credential-based
  reconnection, and BLE provisioning as a single owned component — including
  disconnect recovery, multi-AP priority, time-window deadlines,
  retry-in-place provisioning and  NVS-persisted credentials with LRU ranking. 
  Other components observe state through an event interface and never touch esp_wifi directly.

url: "https://github.com/embedblocks/wifi-manager"

dependencies:
  idf: ">=6.0.0"
  # Replaces the wifi_provisioning component that ESP-IDF v6.0 removed.
  # 1.2.5+ carries the SSID/password overread fix and the correct
  # NETWORK_PROV_WIFI_CRED_FAIL reason codes.
  espressif/network_provisioning: "^1.2.5"

targets:
  - esp32
  - esp32s3
  - esp32c3
  - esp32c6


tags:
  - wifi
  - wifi-manager
  - wifi-station
  - ble
  - ble-provisioning
  - provisioning
  - state-machine
  - auto-reconnect
  - reconnect
  - nvs
  - credentials
  - event-driven
  - lru

files:
   use_gitignore: true
   exclude:
      - ".git/**/*"
      - "docs/**/*"
      - "dist/**/*"
      - "*.docx"
      - "README.txt"
      - "*.png"
      - "*.bin"
      
